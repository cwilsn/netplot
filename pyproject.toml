[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netplot"
version = "0.1.0"
description = "Network plotting and visualization tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jschert" }]
dependencies = ["fastapi>=0.114", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27,<0.29",
    "httpx2>=2",
]

[project.scripts]
netplot = "netplot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the dashboard assets (index.html, app.js, style.css) inside the wheel
# and sdisk. Without this entry a ``pip install netplot`` would install a
# package whose ``netplot/static/`` directory is missing on disk and the
# dashboard would 500 on ``GET /``.
[tool.setuptools.package-data]
netplot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that touch the network or spawn subprocesses",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
]
